name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug dependency tree (temporary)
        run: |
          npm --version
          npm ls typescript ts-api-utils @typescript-eslint/typescript-estree || true
          ls node_modules/@n8n/eslint-plugin-community-nodes/node_modules 2>/dev/null || echo "no nested node_modules"

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
